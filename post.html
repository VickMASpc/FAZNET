<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECRYPTING REPORT | FAZNET</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .post-detail-container {
            max-width: 800px;
            margin: 120px auto;
            padding: 0 20px;
        }
        .post-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 2rem;
        }
        .post-banner {
            width: 100%;
            height: 400px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .post-body {
            font-size: 1.2rem;
            color: var(--text-primary);
            line-height: 1.8;
            font-family: 'Inter', sans-serif;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--freddy-purple);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container--fluid">
        <div class="post-detail-container">
            <a href="index.html" class="back-link">← RETURN TO SECURITY FEED</a>
            <div id="post-content-target">
                <!-- Content will be injected here -->
                <p style="text-align: center; color: var(--text-secondary);">Decrypting report data...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { getPosts } from './js/db.js';

        async function loadPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const posts = await getPosts();
            const post = posts.find(p => p.id === postId);

            if (post) {
                document.title = `${post.title} | FAZNET`;
                document.getElementById('post-content-target').innerHTML = `
                    <div class="post-header">
                        <span class="post-category" style="color: var(--foxy-red)">Incident: ${post.category}</span>
                        <h1 class="glitch" style="font-size: 3.5rem; margin-top: 0.5rem;">${post.title}</h1>
                    </div>
                    <div class="post-banner" style="background-image: url('${post.image || 'assets/placeholder.png'}')"></div>
                    <div class="post-body">
                        ${post.content}
                    </div>
                `;
            } else {
                document.getElementById('post-content-target').innerHTML = `<h1>Report Not Found</h1><p>The requested file has been purged or moved.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
